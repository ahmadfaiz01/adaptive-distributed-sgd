[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-distributed-sgd"
version = "0.1.0"
description = "Reproducible multi-process simulator for adaptive distributed SGD synchronization."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]
